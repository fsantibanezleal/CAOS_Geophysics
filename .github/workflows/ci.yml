name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight contract and lint checkers
        run: pip install ruff==0.15.18 jsonschema==4.25.1
      - name: Lint
        run: ruff check data-pipeline tests scripts/build_api_contracts.py scripts/check_api_contracts.py
      - name: CONTRACT 2, manifests <-> artifacts consistent (no drift)
        run: python scripts/check_artifacts.py
      - name: M13 committed browser-asset integrity (no training)
        run: python scripts/check_phase_assets.py
      - name: Product requirement ledger integrity (not release acceptance)
        run: python scripts/check_sdd_convergence.py
      - name: M01-M13 wiki structure and implementation-link coverage (not science acceptance)
        run: python scripts/check_docs_matrix.py
      - name: M01-M13 declared gate inventory (not scientific acceptance)
        run: |
          python scripts/check_method_matrix.py --report-only
          python -m unittest tests/test_method_matrix.py
      - name: One deploy place
        run: python scripts/check_deploy_place.py
      - name: Contract catalog paths and required fields
        run: python scripts/check_contracts.py docs/contracts/catalog.md --repo-root .
      - name: API route coverage, OpenAPI export and JSON Schema payload checks
        run: |
          python scripts/build_api_contracts.py --check
          python scripts/check_api_contracts.py
      - name: Contract schema versions and lock
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "${base//0/}" ]; then base=origin/develop; fi
          python scripts/check_contract_versions.py --base "$base"
      - name: Committed catalogue readiness record
        run: python scripts/check_readiness.py
      - name: Notebook structure and bilingual static guard; no notebook execution
        run: python scripts/check_notebooks.py
      - name: Reader-facing method names; internal classification stays internal
        run: python scripts/check_internal_names.py
      - name: Repository area index
        run: python scripts/check_readme_areas.py

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Base-integrity guards (the regressions this archetype forbids)
        run: |
          fail=0
          # a real .env must never be tracked (only .env.example)
          envs="$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env(\..+)?\.example$' || true)"
          if [ -n "$envs" ]; then
            echo "::error::a real .env is tracked (only .env.example may be)"; fail=1; fi
          # venvs / native binaries / heavy model blobs must never be tracked
          if git ls-files | grep -qiE '(^|/)\.?venv|\.(dll|so|dylib|pt|pth)$'; then
            echo "::error::a venv or native/heavy binary is tracked (recreate from requirements; keep models small/LFS)"; fail=1; fi
          # raw/heavy data must never be tracked, commit only compact derived artifacts under data/derived/
          if git ls-files | grep -qiE '\.(parquet|h5|hdf5|nc|mat|npy)$'; then
            echo "::error::raw/heavy data tracked, commit only compact derived artifacts (data/derived/)"; fail=1; fi
          # no leaked local machine paths in tracked sources
          if git grep -nF 'D:\_Repos' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::leaked local machine path (D:\\_Repos) in a tracked file"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "guards: OK"; fi
          exit $fail
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No template residue (instantiated products must replace the example pipeline)
        run: python scripts/check_template_residue.py
      - name: Single ML VPS source and build policy (no network or scientific execution)
        run: python scripts/check_single_origin.py
      - name: No em-dash or emoji in product content (ADR-0067)
        run: python scripts/check_content_standards.py
      - name: Frontend build contract
        run: cd frontend && npm ci && npm run build
      - name: CI budget, trunk-only triggers, no training (ADR-0074)
        run: python scripts/check_ci_budget.py

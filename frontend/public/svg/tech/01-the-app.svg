<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="Physical models and result views">
<style>
text{fill:var(--color-fg);font:14px var(--font-sans)} .heading{font-weight:600;font-size:16px}
.box{fill:var(--color-surface);stroke:var(--color-border)} .active{fill:var(--color-accent-soft);stroke:var(--color-accent)}
.edge{stroke:var(--color-fg-subtle);stroke-width:1.5;fill:none}.boundary{stroke:var(--color-border);stroke-dasharray:5 5;fill:none}
.l-es{display:none} [data-arch-lang="es"] .l-en{display:none} [data-arch-lang="es"] .l-es{display:inline}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="var(--color-fg-subtle)"/></marker></defs>
<text x="24" y="32" class="l-en heading">Physical models and result views</text><text x="24" y="32" class="l-es heading">Modelos físicos y vistas del resultado</text><g transform="translate(24,65)"><rect width="280" height="115" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Potential fields</text><text x="16" y="28" class="l-es heading">Campos potenciales</text><text x="16" y="55" class="l-en ">3D prisms · density / susceptibility</text><text x="16" y="55" class="l-es ">Prismas 3D · densidad / susceptibilidad</text><text x="16" y="79" class="l-en ">28 × 24 × 16 cells</text><text x="16" y="79" class="l-es ">28 × 24 × 16 celdas</text></g><g transform="translate(340,65)"><rect width="280" height="115" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Magnetotellurics</text><text x="16" y="28" class="l-es heading">Magnetotelúrica</text><text x="16" y="55" class="l-en ">Horizontal layers and half-space</text><text x="16" y="55" class="l-es ">Capas horizontales y semiespacio</text><text x="16" y="79" class="l-en ">Complex impedance · 36 frequencies</text><text x="16" y="79" class="l-es ">Impedancia compleja · 36 frecuencias</text></g><g transform="translate(656,65)"><rect width="280" height="115" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Acoustic waves</text><text x="16" y="28" class="l-es heading">Ondas acústicas</text><text x="16" y="55" class="l-en ">128 × 96 velocity nodes</text><text x="16" y="55" class="l-es ">128 × 96 nodos de velocidad</text><text x="16" y="79" class="l-en ">3 shots · 40 or 20 receivers</text><text x="16" y="79" class="l-es ">3 disparos · 40 o 20 receptores</text></g><path d="M164 180V205H480V232" class="edge" marker-end="url(#a)"/><path d="M480 180V232" class="edge" marker-end="url(#a)"/><path d="M796 180V205H480" class="edge" marker-end="url(#a)"/><g transform="translate(210,240)"><rect width="540" height="115" rx="8" class="active"/><text x="16" y="28" class="l-en heading">Computed result</text><text x="16" y="28" class="l-es heading">Resultado calculado</text><text x="16" y="55" class="l-en ">Known properties → observations → inverse model</text><text x="16" y="55" class="l-es ">Propiedades conocidas → observaciones → modelo inverso</text><text x="16" y="79" class="l-en ">Predicted data, residuals, metrics and recorded states</text><text x="16" y="79" class="l-es ">Datos predichos, residuos, métricas y estados registrados</text></g><path d="M480 355V380H243V392" class="edge" marker-end="url(#a)"/><path d="M480 380H717V392" class="edge" marker-end="url(#a)"/><g transform="translate(24,400)"><rect width="438" height="110" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Model and data</text><text x="16" y="28" class="l-es heading">Modelo y datos</text><text x="16" y="55" class="l-en ">Isosurfaces / cell view · sections · impedance</text><text x="16" y="55" class="l-es ">Isosuperficies / celdas · cortes · impedancia</text><text x="16" y="79" class="l-en ">Wavefields and receiver traces</text><text x="16" y="79" class="l-es ">Campos de onda y trazas de receptores</text></g><g transform="translate(498,400)"><rect width="438" height="110" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Inversion and case analysis</text><text x="16" y="28" class="l-es heading">Inversión y análisis del caso</text><text x="16" y="55" class="l-en ">Property error · data error · optimizer history</text><text x="16" y="55" class="l-es ">Error de propiedad · de datos · historia iterativa</text><text x="16" y="79" class="l-en ">Assumptions, controls and interpretation limits</text><text x="16" y="79" class="l-es ">Supuestos, controles y límites interpretativos</text></g>
</svg>

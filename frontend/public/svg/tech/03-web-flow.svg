<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="Control dependencies">
<style>
text{fill:var(--color-fg);font:14px var(--font-sans)} .heading{font-weight:600;font-size:16px}
.box{fill:var(--color-surface);stroke:var(--color-border)} .active{fill:var(--color-accent-soft);stroke:var(--color-accent)}
.edge{stroke:var(--color-fg-subtle);stroke-width:1.5;fill:none}.boundary{stroke:var(--color-border);stroke-dasharray:5 5;fill:none}
.l-es{display:none} [data-arch-lang="es"] .l-en{display:none} [data-arch-lang="es"] .l-es{display:inline}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="var(--color-fg-subtle)"/></marker></defs>
<text x="24" y="32" class="l-en heading">Control dependencies</text><text x="24" y="32" class="l-es heading">Dependencias de los controles</text><g transform="translate(24,75)"><rect width="280" height="120" rx="8" class="active"/><text x="16" y="28" class="l-en heading">Experiment selection</text><text x="16" y="28" class="l-es heading">Selección experimental</text><text x="16" y="55" class="l-en ">Geological case + condition</text><text x="16" y="55" class="l-es ">Caso geológico + condición</text><text x="16" y="79" class="l-en ">Loads a different computed result</text><text x="16" y="79" class="l-es ">Carga un resultado calculado distinto</text></g><g transform="translate(24,235)"><rect width="280" height="120" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Algorithm selection</text><text x="16" y="28" class="l-es heading">Selección del algoritmo</text><text x="16" y="55" class="l-en ">Select model, prediction, metrics</text><text x="16" y="55" class="l-es ">Selecciona modelo, predicción, métricas</text><text x="16" y="79" class="l-en ">Reset recorded-state index</text><text x="16" y="79" class="l-es ">Reinicia índice de estado guardado</text></g><g transform="translate(24,395)"><rect width="280" height="110" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Camera and display</text><text x="16" y="28" class="l-es heading">Cámara y visualización</text><text x="16" y="55" class="l-en ">Orbit step, opacity, cut, gain</text><text x="16" y="55" class="l-es ">Paso angular, opacidad, corte, ganancia</text><text x="16" y="79" class="l-en ">No change to physical properties</text><text x="16" y="79" class="l-es ">No cambia propiedades físicas</text></g><g transform="translate(390,75)"><rect width="546" height="120" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Loaded artifact</text><text x="16" y="28" class="l-es heading">Resultado cargado</text><text x="16" y="55" class="l-en ">Truth, survey, solutions and numerical provenance</text><text x="16" y="55" class="l-es ">Verdad, levantamiento, soluciones y procedencia numérica</text><text x="16" y="79" class="l-en ">Abort the previous request when selection changes</text><text x="16" y="79" class="l-es ">Cancela la solicitud anterior al cambiar selección</text></g><g transform="translate(390,235)"><rect width="546" height="120" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Recorded-state playback</text><text x="16" y="28" class="l-es heading">Reproducción de estados guardados</text><text x="16" y="55" class="l-en ">Acoustic time: wavefields every 24 ms</text><text x="16" y="55" class="l-es ">Tiempo acústico: campos cada 24 ms</text><text x="16" y="79" class="l-en ">Optimizer states: spacing depends on the algorithm</text><text x="16" y="79" class="l-es ">Estados iterativos: intervalo según el algoritmo</text></g><g transform="translate(390,395)"><rect width="546" height="110" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Rendered view and export</text><text x="16" y="28" class="l-es heading">Vista y exportación</text><text x="16" y="55" class="l-en ">Pointer readout → nearest computed cell / sample</text><text x="16" y="55" class="l-es ">Lectura del cursor → celda / muestra calculada cercana</text><text x="16" y="79" class="l-en ">Export includes the complete result, not a screenshot</text><text x="16" y="79" class="l-es ">Exportar incluye resultado completo, no captura</text></g><path d="M304 130H380" class="edge" marker-end="url(#a)"/><path d="M304 290H380" class="edge" marker-end="url(#a)"/><path d="M304 445H380" class="edge" marker-end="url(#a)"/><path d="M663 195V225" class="edge" marker-end="url(#a)"/><path d="M663 355V385" class="edge" marker-end="url(#a)"/>
</svg>

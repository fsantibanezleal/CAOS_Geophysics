<svg xmlns="http://www.w3.org/2000/svg" class="arch-svg" width="880" viewBox="0 0 880 727" role="img" aria-label="Approved selected project, API eligibility, result and export flow">
<style>
  text{fill:var(--color-fg);font-family:var(--font-sans)}
  .head{font-size:19px;font-weight:700}.kicker{font:600 11px var(--font-mono);fill:var(--color-accent)}
  .ttl{font-size:14px;font-weight:650}.it{font-size:12.5px}.cd{font:11.5px var(--font-mono);fill:var(--color-accent)}
  .mu,.lbl{font-size:11px;fill:var(--color-fg-subtle)}.lbl{font-weight:600}
  .bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1.3}
  .bx-hi{fill:var(--color-accent-soft);stroke:var(--color-accent)}.bx-web{stroke:var(--color-good)}
  .bx-gate{stroke:var(--color-warn)}.band{fill:var(--color-surface);stroke:var(--color-border)}
  .flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.5}.rule{stroke:var(--color-border)}
  svg .l-es{display:none}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:inline}
</style>
<defs><marker id="arrow-web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="var(--color-fg-subtle)" stroke-width="1.5"/></marker></defs>
<text x="24" y="32" class="kicker l-neutral">APPROVED TARGET / 03</text>
<text x="24" y="59" class="l-en head">Selected project → eligible method → result</text>
<text x="24" y="59" class="l-es head">Proyecto elegido → método apto → resultado</text>
<text x="24" y="80" class="mu l-en">The six shared-shell routes frame a single-project App; source, processing and jobs live inside it.</text>
<text x="24" y="80" class="mu l-es">Las seis rutas rodean App de un proyecto; fuente, proceso y tareas van dentro.</text>

<rect x="24" y="104" width="256" height="166" rx="8" class="bx bx-hi"/>
<text x="38" y="129" class="ttl l-en">1 · Select project/data</text><text x="38" y="129" class="ttl l-es">1 · Elegir proyecto/datos</text>
<text x="38" y="151" class="cd l-neutral">Workbench.tsx · SourceRecord</text>
<line x1="38" y1="161" x2="266" y2="161" class="rule"/>
<text x="38" y="184" class="it l-en">Curated or owned source</text><text x="38" y="184" class="it l-es">Fuente curada o propia</text>
<text x="38" y="207" class="it l-en">Rights and raw hash visible</text><text x="38" y="207" class="it l-es">Derechos y hash visibles</text>
<text x="38" y="230" class="it l-en">One dataset version selected</text><text x="38" y="230" class="it l-es">Una versión de datos elegida</text>
<text x="38" y="252" class="mu l-en">No cross-case summary here.</text><text x="38" y="252" class="mu l-es">Sin resumen entre casos aquí.</text>
<path d="M280 186H302" class="flow" marker-end="url(#arrow-web)"/>
<text x="277" y="98" class="lbl l-en">same-origin request</text><text x="277" y="98" class="lbl l-es">petición mismo origen</text>

<rect x="310" y="104" width="256" height="166" rx="8" class="bx"/>
<text x="324" y="129" class="ttl l-en">2 · API checks eligibility</text><text x="324" y="129" class="ttl l-es">2 · API verifica aptitud</text>
<text x="324" y="151" class="cd l-neutral">api/client.ts · SolverJob</text>
<line x1="324" y1="161" x2="552" y2="161" class="rule"/>
<text x="324" y="184" class="it l-en">Format, modality, geometry</text><text x="324" y="184" class="it l-es">Formato, modalidad, geometría</text>
<text x="324" y="207" class="it l-en">Reason for ineligible method</text><text x="324" y="207" class="it l-es">Motivo de método no apto</text>
<text x="324" y="230" class="it l-en">CPU quota or offline lane</text><text x="324" y="230" class="it l-es">Cuota CPU o ruta local</text>
<text x="324" y="252" class="mu l-en">No replay disguised as a solve.</text><text x="324" y="252" class="mu l-es">Sin disfrazar repetición de cálculo.</text>
<path d="M566 186H588" class="flow" marker-end="url(#arrow-web)"/>
<text x="572" y="98" class="lbl l-neutral">fetch</text>

<rect x="596" y="104" width="260" height="166" rx="8" class="bx bx-web"/>
<text x="610" y="129" class="ttl l-en">3 · Durable result</text><text x="610" y="129" class="ttl l-es">3 · Resultado persistente</text>
<text x="610" y="151" class="cd l-neutral">ResultArtifact · SHA-256</text>
<line x1="610" y1="161" x2="842" y2="161" class="rule"/>
<text x="610" y="184" class="it l-en">Observed, predicted, residual</text><text x="610" y="184" class="it l-es">Observado, predicho, residuo</text>
<text x="610" y="207" class="it l-en">Model, axes, units, coverage</text><text x="610" y="207" class="it l-es">Modelo, ejes, unidades, cobertura</text>
<text x="610" y="230" class="it l-en">Attempt and worker lineage</text><text x="610" y="230" class="it l-es">Linaje de intento y worker</text>
<text x="610" y="252" class="mu l-en">Truth only for synthetic data.</text><text x="610" y="252" class="mu l-es">Verdad sólo en datos sintéticos.</text>

<path d="M726 270V296H438V312" class="flow" marker-end="url(#arrow-web)"/>
<text x="470" y="293" class="lbl l-en">typed result and provenance</text><text x="470" y="293" class="lbl l-es">resultado y procedencia</text>
<rect x="24" y="320" width="832" height="203" rx="8" class="band"/>
<text x="40" y="343" class="kicker l-en">ACTIONS INSIDE THE SELECTED-PROJECT WORKBENCH</text><text x="40" y="343" class="kicker l-es">ACCIONES EN EL BANCO DEL PROYECTO ELEGIDO</text>
<rect x="40" y="360" width="252" height="145" rx="6" class="bx"/>
<text x="53" y="384" class="ttl l-en">Method configuration</text><text x="53" y="384" class="ttl l-es">Configurar método</text>
<text x="53" y="406" class="cd l-neutral">M01–M13 · eligibility</text>
<text x="53" y="430" class="it l-en">Physical bounds and weights</text><text x="53" y="430" class="it l-es">Límites físicos y pesos</text>
<text x="53" y="453" class="it l-en">Parameter changes real input</text><text x="53" y="453" class="it l-es">Parámetro cambia entrada real</text>
<text x="53" y="480" class="mu l-en">No inert run control.</text><text x="53" y="480" class="mu l-es">Sin control de ejecución inerte.</text>
<rect x="308" y="360" width="252" height="145" rx="6" class="bx bx-web"/>
<text x="321" y="384" class="ttl l-en">Job or replay state</text><text x="321" y="384" class="ttl l-es">Tarea o estado grabado</text>
<text x="321" y="406" class="cd l-neutral">queued → running → verdict</text>
<text x="321" y="430" class="it l-en">Cancel, fail, nonconverge</text><text x="321" y="430" class="it l-es">Cancelar, fallar, no converger</text>
<text x="321" y="453" class="it l-en">Replay is explicitly labelled</text><text x="321" y="453" class="it l-es">Repetición identificada</text>
<text x="321" y="480" class="mu l-en">No fabricated progress.</text><text x="321" y="480" class="mu l-es">Sin progreso fabricado.</text>
<rect x="576" y="360" width="264" height="145" rx="6" class="bx bx-web"/>
<text x="589" y="384" class="ttl l-en">Linked scientific views</text><text x="589" y="384" class="ttl l-es">Vistas científicas ligadas</text>
<text x="589" y="406" class="cd l-neutral">EarthScene.tsx · science.ts</text>
<text x="589" y="430" class="it l-en">Units, coverage, signed residual</text><text x="589" y="430" class="it l-es">Unidades, cobertura, residuo</text>
<text x="589" y="453" class="it l-en">3D angle only for real volume</text><text x="589" y="453" class="it l-es">Ángulo 3D sólo para volumen</text>
<text x="589" y="480" class="mu l-en">Display does not change physics.</text><text x="589" y="480" class="mu l-es">La vista no altera la física.</text>
<path d="M292 432H304 M560 432H572" class="flow" marker-end="url(#arrow-web)"/>
<text x="40" y="548" class="lbl l-en">render physical axes + units</text><text x="40" y="548" class="lbl l-es">representar ejes + unidades</text>
<path d="M438 523V563" class="flow" marker-end="url(#arrow-web)"/>
<rect x="24" y="570" width="518" height="113" rx="8" class="bx bx-web"/>
<text x="38" y="594" class="ttl l-en">Result view and round-trip export</text><text x="38" y="594" class="ttl l-es">Vista y exportación reproducible</text>
<text x="38" y="617" class="cd l-neutral">ResultArtifact · file hashes</text>
<text x="38" y="641" class="it l-en">Raw access, config, axes and evaluation</text><text x="38" y="641" class="it l-es">Acceso crudo, config, ejes y evaluación</text>
<text x="38" y="663" class="mu l-en">Only permitted bytes travel in bundles.</text><text x="38" y="663" class="mu l-es">Sólo bytes permitidos viajan.</text>
<rect x="556" y="570" width="300" height="113" rx="8" class="bx bx-gate"/>
<text x="570" y="594" class="ttl l-en">Offline method handoff</text><text x="570" y="594" class="ttl l-es">Entrega de método local</text>
<text x="570" y="617" class="cd l-neutral">recipe · artifact import</text>
<text x="570" y="641" class="it l-en">Full FWI / training locally</text><text x="570" y="641" class="it l-es">FWI / entrenar localmente</text>
<text x="570" y="663" class="mu l-en">Not an online run button.</text><text x="570" y="663" class="mu l-es">No es botón de cálculo web.</text>
<text x="24" y="713" class="mu l-en">LIVE 0.04.001: static case lookup and replay; no project/job API. The diagram above is the approved target.</text>
<text x="24" y="713" class="mu l-es">LIVE 0.04.001: casos y repetición estáticos; sin API de proyectos/tareas. Arriba: objetivo aprobado.</text>
</svg>

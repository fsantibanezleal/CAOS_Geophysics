<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="Forward and inverse operators">
<style>
text{fill:var(--color-fg);font:14px var(--font-sans)} .heading{font-weight:600;font-size:16px}
.box{fill:var(--color-surface);stroke:var(--color-border)} .active{fill:var(--color-accent-soft);stroke:var(--color-accent)}
.edge{stroke:var(--color-fg-subtle);stroke-width:1.5;fill:none}.boundary{stroke:var(--color-border);stroke-dasharray:5 5;fill:none}
.l-es{display:none} [data-arch-lang="es"] .l-en{display:none} [data-arch-lang="es"] .l-es{display:inline}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="var(--color-fg-subtle)"/></marker></defs>
<text x="24" y="32" class="l-en heading">Forward and inverse operators</text><text x="24" y="32" class="l-es heading">Operadores directos e inversos</text><g transform="translate(24,80)"><rect width="274" height="110" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Known model mtrue</text><text x="16" y="28" class="l-es heading">Modelo conocido mreal</text><text x="16" y="55" class="l-en ">Geometry + physical properties</text><text x="16" y="55" class="l-es ">Geometría + propiedades físicas</text><text x="16" y="79" class="l-en ">Used for synthetic evaluation</text><text x="16" y="79" class="l-es ">Se usa para evaluación sintética</text></g><g transform="translate(343,80)"><rect width="274" height="110" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Forward operator F</text><text x="16" y="28" class="l-es heading">Operador directo F</text><text x="16" y="55" class="l-en ">Prisms / impedance / wave equation</text><text x="16" y="55" class="l-es ">Prismas / impedancia / ecuación de onda</text><text x="16" y="79" class="l-en ">dclean = F(mtrue)</text><text x="16" y="79" class="l-es ">dlimpio = F(mreal)</text></g><g transform="translate(662,80)"><rect width="274" height="110" rx="8" class="active"/><text x="16" y="28" class="l-en heading">Observed data d</text><text x="16" y="28" class="l-es heading">Datos observados d</text><text x="16" y="55" class="l-en ">Seeded noise + coverage mask</text><text x="16" y="55" class="l-es ">Ruido con semilla + máscara</text><text x="16" y="79" class="l-en ">d = dclean + ε</text><text x="16" y="79" class="l-es ">d = dlimpio + ε</text></g><path d="M298 135H333" class="edge" marker-end="url(#a)"/><path d="M617 135H652" class="edge" marker-end="url(#a)"/><g transform="translate(662,295)"><rect width="274" height="125" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Inverse problem</text><text x="16" y="28" class="l-es heading">Problema inverso</text><text x="16" y="55" class="l-en ">Data residual + model penalty</text><text x="16" y="55" class="l-es ">Residuo de datos + penalización</text><text x="16" y="79" class="l-en ">Minimize the specified objective</text><text x="16" y="79" class="l-es ">Minimiza el objetivo especificado</text><text x="16" y="103" class="l-en ">Return estimated properties m̂</text><text x="16" y="103" class="l-es ">Devuelve propiedades estimadas m̂</text></g><g transform="translate(343,295)"><rect width="274" height="125" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Predicted response F(m̂)</text><text x="16" y="28" class="l-es heading">Respuesta predicha F(m̂)</text><text x="16" y="55" class="l-en ">Same physical forward operator</text><text x="16" y="55" class="l-es ">Mismo operador físico directo</text><text x="16" y="79" class="l-en ">Evaluate data-space error</text><text x="16" y="79" class="l-es ">Evalúa error en espacio de datos</text><text x="16" y="103" class="l-en ">Model penalty is not data error</text><text x="16" y="103" class="l-es ">Penalización no es error de datos</text></g><g transform="translate(24,295)"><rect width="274" height="125" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Known-model error</text><text x="16" y="28" class="l-es heading">Error de modelo conocido</text><text x="16" y="55" class="l-en ">Compare m̂ with mtrue</text><text x="16" y="55" class="l-es ">Compara m̂ con mreal</text><text x="16" y="79" class="l-en ">Only available for synthetic truth</text><text x="16" y="79" class="l-es ">Sólo con verdad sintética</text><text x="16" y="103" class="l-en ">Different target from residual fit</text><text x="16" y="103" class="l-es ">Distinto del ajuste de residuos</text></g><path d="M800 190V285" class="edge" marker-end="url(#a)"/><path d="M662 357H627" class="edge" marker-end="url(#a)"/><path d="M343 357H308" class="edge" marker-end="url(#a)"/><path d="M162 190V285" class="edge" marker-end="url(#a)"/><path d="M480 295V238H790" class="edge" marker-end="url(#a)"/><text x="24" y="480" class="l-en ">A low residual does not eliminate the null space or validate a geological interpretation.</text><text x="24" y="480" class="l-es ">Un residuo bajo no elimina el espacio nulo ni valida una interpretación geológica.</text>
</svg>

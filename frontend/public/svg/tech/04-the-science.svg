<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-labelledby="title"><title id="title">The experiment is a chain of testable operations</title><rect width="1080" height="340" rx="12" fill="#f5f4ef"/><text x="38" y="55" font-family="Georgia,serif" font-size="27" fill="#243338">The experiment is a chain of testable operations</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#53788a"/></marker></defs><g transform="translate(38,105)"><rect width="310" height="184" rx="4" fill="#fffefa" stroke="#cdd7d0"/><text x="22" y="33" font-family="monospace" font-size="12" fill="#245b72">01 / FORWARD PROBLEM</text><text x="22" y="88" font-family="system-ui" font-size="15" fill="#243338">Construct geology and survey</text><text x="22" y="119" font-family="system-ui" font-size="13" fill="#536568">Apply physical operator</text><path d="M22 150H288" stroke="#d6dcd6"/></g><path d="M352 196h23" stroke="#53788a" marker-end="url(#arrow)"/><g transform="translate(382,105)"><rect width="310" height="184" rx="4" fill="#fffefa" stroke="#cdd7d0"/><text x="22" y="33" font-family="monospace" font-size="12" fill="#245b72">02 / INVERSE PROBLEM</text><text x="22" y="88" font-family="system-ui" font-size="15" fill="#243338">Noise / mask / optimize</text><text x="22" y="119" font-family="system-ui" font-size="13" fill="#536568">Declare prior and bounds</text><path d="M22 150H288" stroke="#d6dcd6"/></g><path d="M696 196h23" stroke="#53788a" marker-end="url(#arrow)"/><g transform="translate(726,105)"><rect width="310" height="184" rx="4" fill="#fffefa" stroke="#cdd7d0"/><text x="22" y="33" font-family="monospace" font-size="12" fill="#245b72">03 / FALSIFICATION</text><text x="22" y="88" font-family="system-ui" font-size="15" fill="#243338">Known-truth model error</text><text x="22" y="119" font-family="system-ui" font-size="13" fill="#536568">Data residual / derivative tests</text><path d="M22 150H288" stroke="#d6dcd6"/></g></svg>

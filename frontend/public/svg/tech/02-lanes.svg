<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="Local computation and browser operations">
<style>
text{fill:var(--color-fg);font:14px var(--font-sans)} .heading{font-weight:600;font-size:16px}
.box{fill:var(--color-surface);stroke:var(--color-border)} .active{fill:var(--color-accent-soft);stroke:var(--color-accent)}
.edge{stroke:var(--color-fg-subtle);stroke-width:1.5;fill:none}.boundary{stroke:var(--color-border);stroke-dasharray:5 5;fill:none}
.l-es{display:none} [data-arch-lang="es"] .l-en{display:none} [data-arch-lang="es"] .l-es{display:inline}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="var(--color-fg-subtle)"/></marker></defs>
<text x="24" y="32" class="l-en heading">Local computation and browser operations</text><text x="24" y="32" class="l-es heading">Cálculo local y operaciones del navegador</text><text x="24" y="70" class="l-en heading">LOCAL PYTHON / CUDA</text><text x="24" y="70" class="l-es heading">PYTHON / CUDA LOCAL</text><g transform="translate(24,90)"><rect width="282" height="130" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Physical operators</text><text x="16" y="28" class="l-es heading">Operadores físicos</text><text x="16" y="55" class="l-en ">SimPEG prism integration</text><text x="16" y="55" class="l-es ">Integración prismática SimPEG</text><text x="16" y="79" class="l-en ">Complex impedance recursion</text><text x="16" y="79" class="l-es ">Recursión de impedancia compleja</text><text x="16" y="103" class="l-en ">Deepwave acoustic propagation</text><text x="16" y="103" class="l-es ">Propagación acústica Deepwave</text></g><g transform="translate(340,90)"><rect width="282" height="130" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Optimization and training</text><text x="16" y="28" class="l-es heading">Optimización y entrenamiento</text><text x="16" y="55" class="l-en ">SciPy linear solve / TRF</text><text x="16" y="55" class="l-es ">Solución lineal SciPy / TRF</text><text x="16" y="79" class="l-en ">PyTorch differentiation / Adam</text><text x="16" y="79" class="l-es ">Diferenciación PyTorch / Adam</text><text x="16" y="103" class="l-en ">Independent network splits</text><text x="16" y="103" class="l-es ">Particiones independientes</text></g><g transform="translate(656,90)"><rect width="280" height="130" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Export and validation</text><text x="16" y="28" class="l-es heading">Exportación y validación</text><text x="16" y="55" class="l-en ">Arrays + physical metadata</text><text x="16" y="55" class="l-es ">Arreglos + metadatos físicos</text><text x="16" y="79" class="l-en ">Hashes and model checkpoints</text><text x="16" y="79" class="l-es ">Hashes y pesos entrenados</text><text x="16" y="103" class="l-en ">Numerical identity tests</text><text x="16" y="103" class="l-es ">Pruebas de identidades numéricas</text></g><path d="M306 150H330" class="edge" marker-end="url(#a)"/><path d="M622 150H646" class="edge" marker-end="url(#a)"/><path d="M24 260H936" class="boundary"/><text x="24" y="290" class="l-en heading">BROWSER / STATIC HOSTS</text><text x="24" y="290" class="l-es heading">NAVEGADOR / HOSTS ESTÁTICOS</text><g transform="translate(24,320)"><rect width="282" height="150" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Artifact selection</text><text x="16" y="28" class="l-es heading">Selección de resultados</text><text x="16" y="55" class="l-en ">Case + experimental condition</text><text x="16" y="55" class="l-es ">Caso + condición experimental</text><text x="16" y="79" class="l-en ">Catalog → JSON arrays</text><text x="16" y="79" class="l-es ">Catálogo → arreglos JSON</text><text x="16" y="103" class="l-en ">VPS and GitHub Pages</text><text x="16" y="103" class="l-es ">VPS y GitHub Pages</text></g><g transform="translate(340,320)"><rect width="282" height="150" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Visual operations</text><text x="16" y="28" class="l-es heading">Operaciones visuales</text><text x="16" y="55" class="l-en ">Orbit, cuts, property threshold</text><text x="16" y="55" class="l-es ">Órbita, cortes, umbral de propiedad</text><text x="16" y="79" class="l-en ">Recorded time / optimizer state</text><text x="16" y="79" class="l-es ">Tiempo / estado iterativo guardado</text><text x="16" y="103" class="l-en ">Same arrays in both hosts</text><text x="16" y="103" class="l-es ">Mismos arreglos en ambos hosts</text></g><g transform="translate(656,320)"><rect width="280" height="150" rx="8" class="active"/><text x="16" y="28" class="l-en heading">Live MT forward model</text><text x="16" y="28" class="l-es heading">Modelo directo MT en vivo</text><text x="16" y="55" class="l-en ">User resistivities and thicknesses</text><text x="16" y="55" class="l-es ">Resistividades y espesores definidos</text><text x="16" y="79" class="l-en ">64 logarithmic frequencies</text><text x="16" y="79" class="l-es ">64 frecuencias logarítmicas</text><text x="16" y="103" class="l-en ">Impedance → resistivity / phase</text><text x="16" y="103" class="l-es ">Impedancia → resistividad / fase</text></g><path d="M796 220V240H164V310" class="edge" marker-end="url(#a)"/><path d="M306 380H330" class="edge" marker-end="url(#a)"/>
</svg>

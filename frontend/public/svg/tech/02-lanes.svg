<svg xmlns="http://www.w3.org/2000/svg" class="arch-svg" width="880" viewBox="0 0 880 697" role="img" aria-label="Approved local, worker, replay and browser execution lanes">
<style>
  text{fill:var(--color-fg);font-family:var(--font-sans)}
  .head{font-size:19px;font-weight:700}.kicker{font:600 11px var(--font-mono);fill:var(--color-accent)}
  .ttl{font-size:14px;font-weight:650}.it{font-size:12.5px}.cd{font:11.5px var(--font-mono);fill:var(--color-accent)}
  .mu,.lbl{font-size:11px;fill:var(--color-fg-subtle)}.lbl{font-weight:600}
  .lane{fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.3}
  .bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1.3}
  .bx-compute{stroke:var(--color-accent-2)}.bx-hi{fill:var(--color-accent-soft);stroke:var(--color-accent)}
  .bx-web{stroke:var(--color-good)}.bx-gate{stroke:var(--color-warn)}
  .flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.5}.rule{stroke:var(--color-border)}
  svg .l-es{display:none}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:inline}
</style>
<defs><marker id="arrow-lanes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="var(--color-fg-subtle)" stroke-width="1.5"/></marker></defs>
<text x="24" y="32" class="kicker l-neutral">APPROVED TARGET / 02</text>
<text x="24" y="59" class="l-en head">Where each calculation actually runs</text><text x="24" y="59" class="l-es head">Dónde se ejecuta cada cálculo</text>
<text x="24" y="80" class="mu l-en">One ML VPS origin is planned with a bounded CPU worker and a full local research lane.</text><text x="24" y="80" class="mu l-es">Se prevé un origen ML VPS con worker CPU acotado y una ruta local completa.</text>

<rect x="24" y="97" width="832" height="212" rx="8" class="lane"/>
<text x="40" y="119" class="kicker l-en">A · LOCAL OFFLINE / CPU + GPU</text><text x="40" y="119" class="kicker l-es">A · LOCAL FUERA DE LÍNEA / CPU + GPU</text>
<rect x="40" y="136" width="256" height="153" rx="6" class="bx bx-compute"/>
<text x="53" y="159" class="ttl l-en">Full scientific pipeline</text><text x="53" y="159" class="ttl l-es">Proceso científico completo</text>
<text x="53" y="181" class="cd l-neutral">ingest → preprocess → dataset</text>
<text x="53" y="205" class="it l-en">Rights, format QC and split</text><text x="53" y="205" class="it l-es">Derechos, formato y partición</text>
<text x="53" y="226" class="cd l-neutral">M01–M13 · pinned engines</text>
<text x="53" y="249" class="it l-en">3D sweeps and FWI stay local</text><text x="53" y="249" class="it l-es">3D y FWI completos son locales</text>
<text x="53" y="273" class="mu l-en">Same typed result contract.</text><text x="53" y="273" class="mu l-es">Mismo contrato de resultados.</text>
<rect x="312" y="136" width="256" height="153" rx="6" class="bx bx-compute"/>
<text x="325" y="159" class="ttl l-en">Training and deep solves</text><text x="325" y="159" class="ttl l-es">Entrenar y resolver a fondo</text>
<text x="325" y="181" class="cd l-neutral">M10 FWI · M11 joint · M12/M13</text>
<text x="325" y="205" class="it l-en">GPU when measured and available</text><text x="325" y="205" class="it l-es">GPU si está disponible y medida</text>
<text x="325" y="226" class="cd l-neutral">checkpoint · split hashes</text>
<text x="325" y="249" class="it l-en">M13 browser export needs parity</text><text x="325" y="249" class="it l-es">M13 web requiere paridad</text>
<text x="325" y="273" class="mu l-en">No server-side training.</text><text x="325" y="273" class="mu l-es">Sin entrenar en servidor.</text>
<rect x="584" y="136" width="256" height="153" rx="6" class="bx bx-gate"/>
<text x="597" y="159" class="ttl l-en">Independent evidence</text><text x="597" y="159" class="ttl l-es">Evidencia independiente</text>
<text x="597" y="181" class="cd l-neutral">oracle · holdout · hashes</text>
<text x="597" y="205" class="it l-en">Synthetic truth only if generated</text><text x="597" y="205" class="it l-es">Verdad sólo si es sintética</text>
<text x="597" y="226" class="it l-en">Field prediction on withheld data</text><text x="597" y="226" class="it l-es">Predicción de campo reservada</text>
<text x="597" y="249" class="it l-en">Failed / unresolved kept visible</text><text x="597" y="249" class="it l-es">Fallos y dudas siguen visibles</text>
<text x="597" y="273" class="mu l-en">No combined science score.</text><text x="597" y="273" class="mu l-es">Sin puntaje científico único.</text>
<path d="M296 208H308 M568 208H580" class="flow" marker-end="url(#arrow-lanes)"/>
<text x="209" y="302" class="lbl l-en">datasets → methods</text><text x="209" y="302" class="lbl l-es">datos → métodos</text>
<text x="489" y="302" class="lbl l-en">results → oracle</text><text x="489" y="302" class="lbl l-es">resultados → criterio</text>
<path d="M720 309V329" class="flow" marker-end="url(#arrow-lanes)"/>
<text x="543" y="326" class="lbl l-en">release verified artifacts</text><text x="543" y="326" class="lbl l-es">publicar artefactos validados</text>

<rect x="24" y="339" width="832" height="104" rx="8" class="lane"/>
<text x="40" y="362" class="kicker l-en">B · IMMUTABLE RESULT / REPLAY BRIDGE</text><text x="40" y="362" class="kicker l-es">B · RESULTADO INMUTABLE / REPRODUCCIÓN</text>
<rect x="40" y="375" width="800" height="52" rx="6" class="bx bx-hi"/>
<text x="54" y="397" class="cd l-neutral">ResultArtifact · engine digest · input hashes · file SHA-256</text>
<text x="54" y="416" class="it l-en">Observed, predicted, residual, model, units, coverage and rights remain together.</text>
<text x="54" y="416" class="it l-es">Observado, predicho, residuo, modelo, unidades, cobertura y derechos juntos.</text>
<path d="M300 443V475 M582 443V475" class="flow" marker-end="url(#arrow-lanes)"/>
<text x="164" y="466" class="lbl l-en">serve permitted results</text><text x="164" y="466" class="lbl l-es">servir resultados permitidos</text>
<text x="630" y="466" class="lbl l-en">read / inspect</text><text x="630" y="466" class="lbl l-es">leer / inspeccionar</text>

<rect x="24" y="483" width="268" height="174" rx="8" class="lane"/>
<text x="40" y="506" class="kicker l-en">C · ONE ML VPS ORIGIN</text><text x="40" y="506" class="kicker l-es">C · UN ORIGEN ML VPS</text>
<rect x="40" y="522" width="236" height="120" rx="6" class="bx"/>
<text x="53" y="544" class="ttl l-neutral">FastAPI + CPU worker</text>
<text x="53" y="566" class="it l-en">API admits bounded jobs</text><text x="53" y="566" class="it l-es">API admite tareas acotadas</text>
<text x="53" y="588" class="it l-en">Worker computes separately</text><text x="53" y="588" class="it l-es">Worker calcula separado</text>
<text x="53" y="612" class="mu l-en">No GPU or full FWI online.</text><text x="53" y="612" class="mu l-es">Sin GPU ni FWI completo web.</text>
<path d="M292 571H308" class="flow" marker-end="url(#arrow-lanes)"/>
<text x="295" y="555" class="lbl l-neutral">HTTP</text>

<rect x="316" y="483" width="540" height="174" rx="8" class="lane"/>
<text x="332" y="506" class="kicker l-en">D · BROWSER / SELECTED PROJECT</text><text x="332" y="506" class="kicker l-es">D · NAVEGADOR / PROYECTO ELEGIDO</text>
<rect x="332" y="522" width="248" height="120" rx="6" class="bx bx-web"/>
<text x="345" y="544" class="ttl l-en">Inspect real results</text><text x="345" y="544" class="ttl l-es">Inspeccionar resultados</text>
<text x="345" y="566" class="cd l-neutral">Workbench.tsx · EarthScene.tsx</text>
<text x="345" y="588" class="it l-en">Axes, linked views, export</text><text x="345" y="588" class="it l-es">Ejes, vistas ligadas, exportar</text>
<text x="345" y="612" class="mu l-en">Replay labelled as replay.</text><text x="345" y="612" class="mu l-es">Repetición marcada como tal.</text>
<rect x="592" y="522" width="248" height="120" rx="6" class="bx bx-web"/>
<text x="605" y="544" class="ttl l-en">Conditional client inference</text><text x="605" y="544" class="ttl l-es">Inferencia web condicional</text>
<text x="605" y="566" class="cd l-neutral">M13 · exported phase picker</text>
<text x="605" y="588" class="it l-en">Held-out real trace parity</text><text x="605" y="588" class="it l-es">Paridad con trazas reales</text>
<text x="605" y="612" class="mu l-en">Not enabled before its gate.</text><text x="605" y="612" class="mu l-es">No se activa sin validar.</text>
<text x="24" y="684" class="mu l-en">LIVE 0.04.001: Pages + ML VPS serve static replay and browser MT forward; no online job API.</text>
<text x="24" y="684" class="mu l-es">LIVE 0.04.001: Pages + ML VPS sirven repetición estática y MT directo web; sin API de tareas.</text>
</svg>

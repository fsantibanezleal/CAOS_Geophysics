<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="Artifact array contracts">
<style>
text{fill:var(--color-fg);font:14px var(--font-sans)} .heading{font-weight:600;font-size:16px}
.box{fill:var(--color-surface);stroke:var(--color-border)} .active{fill:var(--color-accent-soft);stroke:var(--color-accent)}
.edge{stroke:var(--color-fg-subtle);stroke-width:1.5;fill:none}.boundary{stroke:var(--color-border);stroke-dasharray:5 5;fill:none}
.l-es{display:none} [data-arch-lang="es"] .l-en{display:none} [data-arch-lang="es"] .l-es{display:inline}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="var(--color-fg-subtle)"/></marker></defs>
<text x="24" y="32" class="l-en heading">Artifact array contracts</text><text x="24" y="32" class="l-es heading">Contratos de arreglos</text><g transform="translate(24,72)"><rect width="440" height="130" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Potential-field volumes</text><text x="16" y="28" class="l-es heading">Volúmenes de campos potenciales</text><text x="16" y="55" class="l-en ">Flattened [z, northing, easting]; easting is fastest</text><text x="16" y="55" class="l-es ">Vector [z, norte, este]; este varía más rápido</text><text x="16" y="79" class="l-en ">16 × 24 × 28 cells; spacing 70 × 80 × 80 m</text><text x="16" y="79" class="l-es ">16 × 24 × 28 celdas; pasos 70 × 80 × 80 m</text><text x="16" y="103" class="l-en ">Origin, centres, units and station coordinates</text><text x="16" y="103" class="l-es ">Origen, centros, unidades y coordenadas</text></g><g transform="translate(496,72)"><rect width="440" height="130" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Seismic arrays</text><text x="16" y="28" class="l-es heading">Arreglos sísmicos</text><text x="16" y="55" class="l-en ">Velocity and wavefield: [depth, distance]</text><text x="16" y="55" class="l-es ">Velocidad y ondas: [profundidad, distancia]</text><text x="16" y="79" class="l-en ">Receiver data: [shot, receiver, time]</text><text x="16" y="79" class="l-es ">Receptores: [disparo, receptor, tiempo]</text><text x="16" y="103" class="l-en ">12.5 m grid; 4 ms exported receiver samples</text><text x="16" y="103" class="l-es ">Malla 12,5 m; muestras de receptores de 4 ms</text></g><g transform="translate(24,252)"><rect width="440" height="120" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Layered-earth responses</text><text x="16" y="28" class="l-es heading">Respuestas estratificadas</text><text x="16" y="55" class="l-en ">n resistivities and n−1 thicknesses</text><text x="16" y="55" class="l-es ">n resistividades y n−1 espesores</text><text x="16" y="79" class="l-en ">Real / imaginary impedance, Ω</text><text x="16" y="79" class="l-es ">Impedancia real / imaginaria, Ω</text><text x="16" y="103" class="l-en ">Apparent resistivity Ω m; phase degrees</text><text x="16" y="103" class="l-es ">Resistividad aparente Ω m; fase grados</text></g><g transform="translate(496,252)"><rect width="440" height="120" rx="8" class="box"/><text x="16" y="28" class="l-en heading">Model checkpoints</text><text x="16" y="28" class="l-es heading">Pesos entrenados</text><text x="16" y="55" class="l-en ">Named tensors, dimensions and values</text><text x="16" y="55" class="l-es ">Tensores nombrados, dimensiones y valores</text><text x="16" y="79" class="l-en ">Training-only input normalization</text><text x="16" y="79" class="l-es ">Normalización sólo de entrenamiento</text><text x="16" y="103" class="l-en ">Validation selection; separate test errors</text><text x="16" y="103" class="l-es ">Selección por validación; prueba separada</text></g><g transform="translate(220,420)"><rect width="520" height="90" rx="8" class="active"/><text x="16" y="28" class="l-en heading">Release integrity</text><text x="16" y="28" class="l-es heading">Integridad de publicación</text><text x="16" y="55" class="l-en ">Identity + finite values + SHA-256 + byte size</text><text x="16" y="55" class="l-es ">Identidad + valores finitos + SHA-256 + tamaño</text></g><path d="M244 202V242" class="edge" marker-end="url(#a)"/><path d="M716 202V242" class="edge" marker-end="url(#a)"/><path d="M244 372V400H480V410" class="edge" marker-end="url(#a)"/><path d="M716 372V400H480" class="edge" marker-end="url(#a)"/>
</svg>

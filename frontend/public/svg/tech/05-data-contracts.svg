<svg xmlns="http://www.w3.org/2000/svg" class="arch-svg" width="880" viewBox="0 0 880 834" role="img" aria-label="Approved source, dataset, job and result evidence contracts">
<style>
  text{fill:var(--color-fg);font-family:var(--font-sans)}
  .head{font-size:19px;font-weight:700}.kicker{font:600 11px var(--font-mono);fill:var(--color-accent)}
  .ttl{font-size:14px;font-weight:650}.it{font-size:12.5px}.cd{font:11.5px var(--font-mono);fill:var(--color-accent)}
  .mu,.lbl{font-size:11px;fill:var(--color-fg-subtle)}.lbl{font-weight:600}
  .band{fill:var(--color-surface);stroke:var(--color-border)}
  .bx{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:1.3}
  .bx-hi{fill:var(--color-accent-soft);stroke:var(--color-accent)}
  .bx-web{stroke:var(--color-good)}.bx-gate{stroke:var(--color-warn)}
  .flow{fill:none;stroke:var(--color-fg-subtle);stroke-width:1.5}.rule{stroke:var(--color-border)}
  svg .l-es{display:none}[data-arch-lang="es"] svg .l-en{display:none}[data-arch-lang="es"] svg .l-es{display:inline}
</style>
<defs><marker id="arrow-contract" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="var(--color-fg-subtle)" stroke-width="1.5"/></marker></defs>
<text x="24" y="32" class="kicker l-neutral">APPROVED TARGET / 05</text>
<text x="24" y="59" class="l-en head">Rights, physical meaning and result identity</text><text x="24" y="59" class="l-es head">Derechos, significado físico e identidad</text>
<text x="24" y="80" class="mu l-en">Source, immutable raw bytes, versioned observations, jobs and results are distinct records.</text>
<text x="24" y="80" class="mu l-es">Fuente, bytes crudos, observaciones, tareas y resultados son registros distintos.</text>

<text x="24" y="112" class="kicker l-en">A · INGESTION CONTRACT / RAW TO DATASET</text><text x="24" y="112" class="kicker l-es">A · INGESTA / DE CRUDO A DATOS</text>
<rect x="24" y="125" width="268" height="185" rx="8" class="bx"/>
<text x="38" y="149" class="ttl l-neutral">SourceRecord</text>
<text x="38" y="171" class="cd l-neutral">source_id · DOI · SHA-256</text>
<line x1="38" y1="181" x2="278" y2="181" class="rule"/>
<text x="38" y="205" class="it l-en">Provider URL or upload</text><text x="38" y="205" class="it l-es">URL proveedor o carga</text>
<text x="38" y="228" class="it l-en">Mirror/link/derivative/forbid</text><text x="38" y="228" class="it l-es">Copiar/enlazar/derivar/prohibir</text>
<text x="38" y="251" class="it l-en">Citation and attribution</text><text x="38" y="251" class="it l-es">Cita y atribución</text>
<text x="38" y="275" class="mu l-en">Unknown rights block raw mirror.</text><text x="38" y="275" class="mu l-es">Derechos dudosos bloquean copia.</text>
<text x="38" y="296" class="mu l-en">Expected bytes checked at ingest.</text><text x="38" y="296" class="mu l-es">Bytes esperados se comprueban.</text>
<rect x="306" y="125" width="268" height="185" rx="8" class="bx bx-gate"/>
<text x="320" y="149" class="ttl l-neutral">RawAsset</text>
<text x="320" y="171" class="cd l-neutral">asset_id · owner · storage key</text>
<line x1="320" y1="181" x2="560" y2="181" class="rule"/>
<text x="320" y="205" class="it l-en">Original bytes immutable</text><text x="320" y="205" class="it l-es">Bytes originales inmutables</text>
<text x="320" y="228" class="it l-en">Detected format and MIME</text><text x="320" y="228" class="it l-es">Formato detectado y MIME</text>
<text x="320" y="251" class="it l-en">Receipt + SHA-256 + QC</text><text x="320" y="251" class="it l-es">Recibo + SHA-256 + QC</text>
<text x="320" y="275" class="mu l-en">Derivatives never replace raw.</text><text x="320" y="275" class="mu l-es">Derivados no sustituyen crudo.</text>
<text x="320" y="296" class="mu l-en">No public raw without rights.</text><text x="320" y="296" class="mu l-es">Sin publicar crudo sin derechos.</text>
<rect x="588" y="125" width="268" height="185" rx="8" class="bx bx-hi"/>
<text x="602" y="149" class="ttl l-neutral">ObservationDataset</text>
<text x="602" y="171" class="cd l-neutral">dataset_id · version · modality</text>
<line x1="602" y1="181" x2="842" y2="181" class="rule"/>
<text x="602" y="205" class="it l-en">Axes, CRS/datum, units</text><text x="602" y="205" class="it l-es">Ejes, CRS/datum, unidades</text>
<text x="602" y="228" class="it l-en">Geometry, mask, uncertainty</text><text x="602" y="228" class="it l-es">Geometría, máscara, incertidumbre</text>
<text x="602" y="251" class="it l-en">Parser + raw hash lineage</text><text x="602" y="251" class="it l-es">Parser + hashes de origen</text>
<text x="602" y="275" class="mu l-en">EDI is transfer function, not trace.</text><text x="602" y="275" class="mu l-es">EDI es función, no traza cruda.</text>
<text x="602" y="296" class="mu l-en">Clear Lake cl061: QC only.</text><text x="602" y="296" class="mu l-es">Clear Lake cl061: sólo QC.</text>

<path d="M158 310V337 M440 310V337 M722 310V337" class="flow" marker-end="url(#arrow-contract)"/>
<text x="42" y="335" class="lbl l-en">rights verdict</text><text x="42" y="335" class="lbl l-es">decisión derechos</text>
<text x="326" y="335" class="lbl l-en">immutable receipt</text><text x="326" y="335" class="lbl l-es">recibo inmutable</text>
<text x="609" y="335" class="lbl l-en">validated version</text><text x="609" y="335" class="lbl l-es">versión validada</text>
<text x="24" y="369" class="kicker l-en">B · PROCESSING, JOB AND RESULT RECORDS</text><text x="24" y="369" class="kicker l-es">B · PROCESO, TAREA Y RESULTADO</text>
<rect x="24" y="382" width="268" height="126" rx="8" class="bx"/>
<text x="38" y="406" class="ttl l-neutral">ProcessingRun</text>
<text x="38" y="428" class="cd l-neutral">transform DAG · code digest</text>
<text x="38" y="452" class="it l-en">New dataset version + masks</text><text x="38" y="452" class="it l-es">Nueva versión + máscaras</text>
<text x="38" y="478" class="mu l-en">Original is never overwritten.</text><text x="38" y="478" class="mu l-es">Original nunca se reemplaza.</text>
<rect x="306" y="382" width="268" height="126" rx="8" class="bx bx-gate"/>
<text x="320" y="406" class="ttl l-neutral">SolverJob</text>
<text x="320" y="428" class="cd l-neutral">method · lane · attempt · state</text>
<text x="320" y="452" class="it l-en">Bounds, weights, admission</text><text x="320" y="452" class="it l-es">Límites, pesos, admisión</text>
<text x="320" y="478" class="mu l-en">Worker and measured resources.</text><text x="320" y="478" class="mu l-es">Worker y recursos medidos.</text>
<rect x="588" y="382" width="268" height="126" rx="8" class="bx bx-hi"/>
<text x="602" y="406" class="ttl l-neutral">ResultArtifact</text>
<text x="602" y="428" class="cd l-neutral">schema · engine · file hashes</text>
<text x="602" y="452" class="it l-en">Model, prediction, residual</text><text x="602" y="452" class="it l-es">Modelo, predicción, residuo</text>
<text x="602" y="478" class="mu l-en">Field truth stays absent.</text><text x="602" y="478" class="mu l-es">Sin verdad de campo.</text>

<rect x="24" y="538" width="832" height="167" rx="8" class="band"/>
<text x="40" y="562" class="kicker l-en">C · ARRAY ORIENTATION, UNITS AND LINEAGE ARE REQUIRED</text><text x="40" y="562" class="kicker l-es">C · ORIENTACIÓN, UNIDADES Y LINAJE OBLIGATORIOS</text>
<rect x="40" y="578" width="250" height="108" rx="6" class="bx"/>
<text x="53" y="602" class="ttl l-en">Physical axes</text><text x="53" y="602" class="ttl l-es">Ejes físicos</text>
<text x="53" y="626" class="cd l-neutral">axis_order · shape · unit</text>
<text x="53" y="648" class="it l-en">Named dimensions + direction</text><text x="53" y="648" class="it l-es">Dimensiones y sentido</text>
<text x="53" y="671" class="mu l-en">No inferred axis order.</text><text x="53" y="671" class="mu l-es">Sin inferir orden de ejes.</text>
<rect x="306" y="578" width="250" height="108" rx="6" class="bx"/>
<text x="319" y="602" class="ttl l-en">Coordinates + geometry</text><text x="319" y="602" class="ttl l-es">Coordenadas y geometría</text>
<text x="319" y="626" class="cd l-neutral">EPSG or named local frame</text>
<text x="319" y="648" class="it l-en">Datum and vertical sign</text><text x="319" y="648" class="it l-es">Datum y signo vertical</text>
<text x="319" y="671" class="mu l-en">Missing meaning blocks modelling.</text><text x="319" y="671" class="mu l-es">Ambigüedad impide modelar.</text>
<rect x="572" y="578" width="268" height="108" rx="6" class="bx"/>
<text x="585" y="602" class="ttl l-en">Provenance + rights</text><text x="585" y="602" class="ttl l-es">Procedencia y derechos</text>
<text x="585" y="626" class="cd l-neutral">raw → dataset → job → result</text>
<text x="585" y="648" class="it l-en">SHA-256 per exported file</text><text x="585" y="648" class="it l-es">SHA-256 por archivo exportado</text>
<text x="585" y="671" class="mu l-en">No raw mirror without permission.</text><text x="585" y="671" class="mu l-es">Sin copia cruda sin permiso.</text>
<path d="M722 508V527" class="flow" marker-end="url(#arrow-contract)"/>
<text x="568" y="526" class="lbl l-en">reject shape / hash drift</text><text x="568" y="526" class="lbl l-es">rechazar forma / hash</text>
<path d="M440 705V725" class="flow" marker-end="url(#arrow-contract)"/>
<text x="483" y="722" class="lbl l-en">verify before display</text><text x="483" y="722" class="lbl l-es">verificar antes de mostrar</text>
<rect x="24" y="735" width="832" height="75" rx="8" class="bx bx-web"/>
<text x="40" y="758" class="ttl l-en">D · Target contract gate → same-origin API reader</text><text x="40" y="758" class="ttl l-es">D · Contrato objetivo → lector API del mismo origen</text>
<text x="40" y="780" class="cd l-neutral">frontend/src/api/contracts.ts · frontend/src/api/client.ts</text>
<text x="40" y="800" class="it l-en">Reject invalid shape, units, hashes and field truth; show provenance and limits.</text>
<text x="40" y="800" class="it l-es">Rechazar forma, unidades, hashes y verdad de campo; mostrar origen y límites.</text>
<text x="24" y="826" class="mu l-en">LIVE 0.04.001: v2 static JSON and EDI screen remain separate; no web upload or job API.</text>
<text x="24" y="826" class="mu l-es">LIVE 0.04.001: JSON v2 y filtro EDI estáticos siguen aparte; sin carga ni API de tareas.</text>
</svg>

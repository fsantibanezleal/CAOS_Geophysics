<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Roles and assumptions in present-day interpretation</title>
  <desc id="desc">A field observer, inversion analyst and geologist review different records from the same survey.</desc>
  <style>
    .ink { fill: none; stroke: var(--color-fg); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

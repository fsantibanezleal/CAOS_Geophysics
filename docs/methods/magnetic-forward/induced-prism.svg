<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Induced magnetic forward quantities and independent controls</title>
  <desc id="desc">Strict native-array preflight precedes the actual SimPEG Geoana engine. ENU secondary components branch into linear TMI and its susceptibility Jacobian, and stable exact magnitude. Separate Choclo and volume quadrature verify physics; Decimal verifies tiny scalar algebra only. No inverse, field admission or host acceptance is implied.</desc>
  <style>
    /* Exact standalone mirrors of published @fasl-work/caos-app-shell0.6.8 styles.css.
       Inherited shell tokens win when inlined; an img cannot inherit its parent's CSS. */
    svg {
      --figure-bg:#f6f8fa; --figure-surface:#ffffff; --figure-border:#d0d7de;
      --figure-fg:#1f2328; --figure-subtle:#57606a; --figure-accent:#0969da; --figure-good:#1a7f37;
      --figure-font-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      --figure-font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
    }
    @media (prefers-color-scheme:dark) { svg {
      --figure-bg:#0d1117; --figure-surface:#161b22; --figure-border:#30363d;
      --figure-fg:#c9d1d9; --figure-subtle:#9aa6b2; --figure-accent:#58a6ff; --figure-good:#3fb950;
    } }
    .bg { fill:var(--color-bg,var(--figure-bg)); }
    .box { fill:var(--color-surface,var(--figure-surface)); stroke:var(--color-border,var(--figure-border)); stroke-width:2; }
    .engine { stroke:var(--color-accent,var(--figure-accent)); }
    .oracle { stroke:var(--color-good,var(--figure-good)); }
    text { fill:var(--color-fg,var(--figure-fg)); font-family:var(--font-sans,var(--figure-font-sans)); font-size:18px; }
    .small { font-size:17px; fill:var(--color-fg-subtle,var(--figure-subtle)); }
    .mono { font-family:var(--font-mono,var(--figure-font-mono)); font-size:17px; }
    .heading { font-size:23px; font-weight:700; } .label { font-weight:700; }
    .edge { fill:none; stroke:var(--color-accent,var(--figure-accent)); stroke-width:3; marker-end:url(#arrow); }
    svg .l-es { display:none; }
    [data-arch-lang="es"] .l-en { display:none; }
    [data-arch-lang="es"] .l-es { display:inline; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-accent,var(--figure-accent))"/></marker></defs>
  <rect class="bg" width="1200" height="530"/>
  <text class="heading l-en" x="30" y="40">Induced prisms: physical components are not scalar magnitude</text>
  <text class="heading l-es" x="30" y="40">Prismas inducidos: componentes físicos no son magnitud escalar</text>
  <rect class="box" x="30" y="70" width="300" height="160" rx="12"/>
  <text class="label l-en" x="48" y="100">Strict input and preflight</text>
  <text class="label l-es" x="48" y="100">Entrada estricta y límites</text>
  <text class="l-en" x="48" y="130">Metre ENU; x-fast active chi</text>
  <text class="l-es" x="48" y="130">Metros ENU; chi x-rápido</text>
  <text class="l-en" x="48" y="157">Explicit F, I and D; no defaults</text>
  <text class="l-es" x="48" y="157">F, I y D explícitos; sin defecto</text>
  <text class="small l-en" x="48" y="184">Counts before scans / copies</text>
  <text class="small l-es" x="48" y="184">Conteos antes de leer / copiar</text>
  <text class="small l-en" x="48" y="210">Exterior of closed full mesh</text>
  <text class="small l-es" x="48" y="210">Fuera de toda la malla cerrada</text>
  <path class="edge" d="M 335 150 L 375 150"/>
  <rect class="box engine" x="385" y="70" width="340" height="160" rx="12"/>
  <text class="label l-en" x="403" y="100">Actual TensorMesh + SimPEG</text>
  <text class="label l-es" x="403" y="100">TensorMesh + SimPEG reales</text>
  <text class="l-en" x="403" y="130">Geoana; scalar induced model</text>
  <text class="l-es" x="403" y="130">Geoana; inducción escalar</text>
  <text class="l-en" x="403" y="157">float64 RAM G; one process</text>
  <text class="l-es" x="403" y="157">G float64 en RAM; un proceso</text>
  <text class="small mono l-neutral" x="403" y="184">SimPEG: dpred = G chi</text>
  <text class="small l-en" x="403" y="210">b = (east, north, up) in nT</text>
  <text class="small l-es" x="403" y="210">b = (este, norte, arriba) en nT</text>
  <path class="edge" d="M 730 125 L 780 125"/>
  <path class="edge" d="M 730 200 L 755 200 L 755 275 L 780 275"/>
  <rect class="box" x="790" y="70" width="380" height="125" rx="12"/>
  <text class="label l-en" x="808" y="100">Linear TMI = f dot b [nT]</text>
  <text class="label l-es" x="808" y="100">TMI lineal = f punto b [nT]</text>
  <text class="l-en" x="808" y="130">J = d(linear TMI)/d(chi)</text>
  <text class="l-es" x="808" y="130">J = d(TMI lineal)/d(chi)</text>
  <text class="small l-en" x="808" y="160">Physical unit-SI columns [nT/SI]</text>
  <text class="small l-es" x="808" y="160">Columnas físicas por SI [nT/SI]</text>
  <rect class="box" x="790" y="225" width="380" height="105" rx="12"/>
  <text class="label l-en" x="808" y="255">Exact magnitude = |B0+b| - F</text>
  <text class="label l-es" x="808" y="255">Magnitud exacta = |B0+b| - F</text>
  <text class="small l-en" x="808" y="285">Rationalized; tiny nonzero preserved</text>
  <text class="small l-es" x="808" y="285">Racionalizada; conserva no ceros</text>
  <rect class="box oracle" x="30" y="270" width="695" height="150" rx="12"/>
  <text class="label l-en" x="48" y="302">Independent physics: no candidate G or helpers</text>
  <text class="label l-es" x="48" y="302">Física independiente: sin G ni auxiliares del candidato</text>
  <text class="l-en" x="48" y="333">Choclo: explicit six bounds, M in A/m, tesla to nT</text>
  <text class="l-es" x="48" y="333">Choclo: seis límites explícitos, M en A/m, tesla a nT</text>
  <text class="l-en" x="48" y="362">Volume dipoles: converged 24/32-point quadrature</text>
  <text class="l-es" x="48" y="362">Dipolos volumétricos: cuadratura convergente de 24/32 puntos</text>
  <text class="small l-en" x="48" y="392">chi=1 Jacobian oracle is NOT a production chi input</text>
  <text class="small l-es" x="48" y="392">El oráculo chi=1 NO es una entrada chi de producción</text>
  <rect class="box oracle" x="790" y="360" width="380" height="100" rx="12"/>
  <text class="label l-en" x="808" y="391">Decimal80 direct norm oracle</text>
  <text class="label l-es" x="808" y="391">Oráculo Decimal80 de norma directa</text>
  <text class="small l-en" x="808" y="422">Tiny scalar algebra, not field physics</text>
  <text class="small l-es" x="808" y="422">Álgebra escalar diminuta, no de campo</text>
  <text class="l-en" x="30" y="465">Owned write-protected snapshots, not tamperproof storage.</text>
  <text class="l-es" x="30" y="465">Copias propias con escritura desactivada, no almacenamiento inviolable.</text>
  <text class="small l-en" x="30" y="498">No inverse / remanence detection / field admission / online worker / host acceptance.</text>
  <text class="small l-es" x="30" y="498">Sin inversa / detección de remanencia / admisión de campo / proceso en línea / aceptación del servidor.</text>
</svg>

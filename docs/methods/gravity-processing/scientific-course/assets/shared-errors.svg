<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
<title id="title">Shared geoid and density errors / Errores compartidos</title><desc id="desc">One geoid primitive branches to both heights, derivatives recombine before uncertainty. Density correlates stations. / Un geoide afecta ambas alturas; combine derivadas antes del error. Densidad correlaciona estaciones.</desc>
<style>
:root{--bg:#f6f8fa;--surface:#fff;--fg:#1f2328;--muted:#57606a;--border:#d0d7de;--blue:#0969da;--cyan:#0a7c8a;--pink:#bf3989;--warn:#9a6700}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--surface:#161b22;--fg:#c9d1d9;--muted:#9aa6b2;--border:#30363d;--blue:#58a6ff;--cyan:#3fb1c8;--pink:#f778ba;--warn:#d29922}}
text{fill:var(--fg);font:24px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.small{font-size:22px;fill:var(--muted)}.head{font-size:26px;font-weight:600}.line{fill:none;stroke:var(--fg);stroke-width:2.5}.ref{fill:none;stroke:var(--blue);stroke-width:3}.geo{fill:none;stroke:var(--cyan);stroke-width:3;stroke-dasharray:8 5}.mass{fill:var(--cyan);fill-opacity:.13;stroke:var(--cyan);stroke-width:2.5}.layer{fill:none;stroke:var(--pink);stroke-width:3;stroke-dasharray:7 5}.box{fill:var(--surface);stroke:var(--border);stroke-width:2}.warn{fill:var(--warn)}.blue{fill:var(--blue)}.pink{fill:var(--pink)}.cyan{fill:var(--cyan)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="720" rx="12" fill="var(--bg)"/>

<text class="head" x="30" y="48">Shared errors / Errores comunes</text>
<rect class="box" x="180" y="95" width="240" height="75" rx="8"/><text x="200" y="128">One N / Un N</text><text class="small" x="200" y="156">Primitive / Variable</text>
<path class="line" d="M260 170L145 235" marker-end="url(#arrow)"/><path class="line" d="M340 170L445 235" marker-end="url(#arrow)"/>
<rect class="box" x="30" y="245" width="245" height="95" rx="8"/><text x="50" y="278">hᵣ = Hᵣ + N</text><text x="50" y="315">−γₕ · δN</text>
<rect class="box" x="325" y="245" width="245" height="95" rx="8"/><text x="345" y="278">hₛ = Hₛ + N</text><text x="345" y="315">−Cρ · δN</text>
<path class="line" d="M150 340L240 385" marker-end="url(#arrow)"/><path class="line" d="M445 340L360 385" marker-end="url(#arrow)"/>
<rect class="box" x="90" y="395" width="420" height="75" rx="8"/><text x="115" y="428">aₙ = −γₕ − Cρ</text><text class="small" x="115" y="455">Signed first / Primero con signo</text>
<text x="35" y="520">Common δρ / δρ común</text>
<path class="geo" d="M275 530L140 570" marker-end="url(#arrow)"/><path class="geo" d="M290 530L445 570" marker-end="url(#arrow)"/>
<rect class="box" x="35" y="575" width="235" height="80" rx="8"/><text x="55" y="608">Station i</text><text x="55" y="638">Estación i</text>
<rect class="box" x="330" y="575" width="235" height="80" rx="8"/><text x="350" y="608">Station j</text><text x="350" y="638">Estación j</text>
<text x="35" y="687">Covᵢⱼ = C² hₛᵢ hₛⱼ σρ²</text>
</svg>

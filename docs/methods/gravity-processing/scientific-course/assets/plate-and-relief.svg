<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
<title id="title">Plate and actual topography / Placa y topografía real</title><desc id="desc">Different models, same receiver, signed terrain residual T equals B minus actual attraction. / Modelos distintos, mismo receptor, residual T igual B menos atracción real.</desc>
<style>
:root{--bg:#f6f8fa;--surface:#fff;--fg:#1f2328;--muted:#57606a;--border:#d0d7de;--blue:#0969da;--cyan:#0a7c8a;--pink:#bf3989;--warn:#9a6700}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--surface:#161b22;--fg:#c9d1d9;--muted:#9aa6b2;--border:#30363d;--blue:#58a6ff;--cyan:#3fb1c8;--pink:#f778ba;--warn:#d29922}}
text{fill:var(--fg);font:24px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.small{font-size:22px;fill:var(--muted)}.head{font-size:26px;font-weight:600}.line{fill:none;stroke:var(--fg);stroke-width:2.5}.ref{fill:none;stroke:var(--blue);stroke-width:3}.geo{fill:none;stroke:var(--cyan);stroke-width:3;stroke-dasharray:8 5}.mass{fill:var(--cyan);fill-opacity:.13;stroke:var(--cyan);stroke-width:2.5}.layer{fill:none;stroke:var(--pink);stroke-width:3;stroke-dasharray:7 5}.box{fill:var(--surface);stroke:var(--border);stroke-width:2}.warn{fill:var(--warn)}.blue{fill:var(--blue)}.pink{fill:var(--pink)}.cyan{fill:var(--cyan)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="720" rx="12" fill="var(--bg)"/>

<text class="head" x="30" y="48">Mass models / Modelos de masa</text>
<text class="small" x="30" y="84">Schematic / Esquema · g positive ↓</text>
<text x="30" y="130">Infinite plate / Placa infinita</text>
<circle cx="260" cy="170" r="8" fill="var(--fg)"/>
<path class="line" d="M260 184V228" marker-end="url(#arrow)"/><text x="285" y="205">B ↓</text>
<path class="mass" d="M65 235H550V320H65Z"/><path class="ref" d="M65 320H550"/>
<text x="100" y="285">ρ · hₛ</text>
<path class="line" d="M515 241V314" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="528" y="285">hₛ</text>
<path class="line" d="M90 345H530" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="35" y="352">∞</text><text x="550" y="352">∞</text>
<text x="30" y="405">Finite relief / Relieve finito</text>
<circle cx="260" cy="440" r="8" fill="var(--fg)"/>
<path class="line" d="M260 454V496" marker-end="url(#arrow)"/><text x="285" y="475">Aₜₒₚₒ ↓</text>
<path class="mass" d="M65 516L120 490L165 514L205 501L270 517L340 477L385 516L465 494L550 509V565H65Z"/>
<path class="ref" d="M65 565H550"/>
<text x="30" y="615">Dᵦ = D − B · T = B − Aₜₒₚₒ</text>
<text x="30" y="655">Dₜ = Dᵦ + T = D − Aₜₒₚₒ</text>
<text class="small" x="30" y="692">Supplied T / T suministrado · not DEM</text>
</svg>
